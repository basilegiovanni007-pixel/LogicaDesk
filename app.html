<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LogicaDesk – versione web</title>
<meta name="theme-color" content="#cfe3ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LogicaDesk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--ink:#0f172a;--mut:#5b6682;--line:#d3dbf0;--navy:#1e2f86;--ui:system-ui,-apple-system,"Segoe UI",sans-serif;--math:Cambria,"Cambria Math","Noto Serif",Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:16px/1.5 var(--ui);color:var(--ink);display:flex;flex-direction:column;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
 background:radial-gradient(40rem 30rem at 0 0,#bcdcff,transparent 60%),radial-gradient(40rem 30rem at 100% 0,#d8ccff,transparent 60%),
 radial-gradient(40rem 30rem at 0 100%,#c6d6ff,transparent 60%),linear-gradient(#ecf4ff,#f4f0ff) fixed}
header{display:flex;align-items:center;gap:.7rem;padding:.6rem 1rem .2rem}
header svg{width:38px;height:38px;filter:drop-shadow(0 4px 6px rgba(30,60,170,.35))}
header b{font-size:1.25rem;letter-spacing:-.01em}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.58));border:1px solid rgba(255,255,255,.9);border-radius:22px;
 box-shadow:0 14px 36px -16px rgba(60,70,150,.4),inset 0 1px 0 #fff;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:.6rem;padding:.4rem .8rem .8rem}
.bar{display:flex;flex-wrap:wrap;gap:.45rem;padding:.6rem}
.btn{font:600 .92rem var(--ui);padding:.5rem .9rem;border-radius:13px;border:1px solid rgba(40,60,160,.3);color:var(--navy);cursor:pointer;
 background:linear-gradient(#fff,#e3eeff 55%,#c9dcff);box-shadow:inset 0 1px 0 #fff,0 4px 10px -6px rgba(40,70,200,.5)}
.btn:active{transform:translateY(1px);filter:brightness(.96)}
.btn.lil{background:linear-gradient(#faf6ff,#d6c8fb);color:#5a3db0;border-color:rgba(90,61,176,.3)}
.btn.peri{background:linear-gradient(#f6f7ff,#c3ccff);color:#3447b5}
.btn.on{color:#fff;border-color:#0a63d6;background:linear-gradient(#8ccaff,#3b97ff 45%,#1b6fe8);text-shadow:0 1px 0 rgba(0,40,120,.35)}
.sep{width:1px;background:var(--line);margin:0 .1rem}
.keys{display:flex;flex-wrap:wrap;gap:.4rem;padding:0 .6rem .6rem}
.key{width:42px;height:42px;border-radius:13px;font:700 1.15rem var(--math);border:1px solid rgba(60,80,170,.3);padding:0;cursor:pointer;
 box-shadow:inset 0 1px 0 #fff,inset 0 -8px 12px -10px rgba(60,80,170,.4)}
.key:nth-child(3n+1){background:linear-gradient(#f7fbff,#bde0ff);color:#1f5fae}
.key:nth-child(3n+2){background:linear-gradient(#f6f7ff,#c3ccff);color:#3447b5}
.key:nth-child(3n){background:linear-gradient(#faf6ff,#d6c8fb);color:#5a3db0}
.key:active{filter:brightness(.93)}
#greek{display:none}#greek.open{display:flex}
.doc{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#ed{flex:1;width:100%;border:0;background:transparent;padding:1rem 1.1rem;font:17px/1.6 var(--math);color:#334155;resize:none;outline:none}
#tv{display:none;flex-direction:column;flex:1;min-height:0}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;padding:.7rem .8rem;border-bottom:1px solid var(--line)}
.ctl label{display:flex;align-items:center;gap:.3rem;font-size:.9rem;color:var(--mut)}
.ctl output{min-width:1.6rem;text-align:center;font-weight:700;color:var(--ink)}
.ctl .btn{padding:.35rem .7rem}
.grid{overflow:auto;padding:.8rem;flex:1}
table{border-collapse:collapse;border:2px solid #2c3e9e;background:#fff;margin:0 auto}
td{padding:0;border:1px solid #b8c4e6}
td input{width:5.2rem;height:2.7rem;border:0;text-align:center;font:17px var(--math);background:#fff;color:var(--ink);outline:none;border-radius:0}
td input:focus{box-shadow:inset 0 0 0 2px #0a84ff}
tr:first-child td{border-bottom:2px solid #2c3e9e}tr:first-child input{background:#dfeaff;color:var(--navy);font-weight:700}
td input.v{background:#e3efff;color:#1d62d6;font-weight:700}td input.f{background:#eee8ff;color:#6a43c2;font-weight:700}
dialog{border:0;border-radius:22px;padding:0;width:min(560px,94vw);max-height:84vh;background:#f7f9ff;color:var(--ink);box-shadow:0 30px 80px -20px rgba(30,40,120,.5)}
dialog::backdrop{background:rgba(30,40,100,.35)}
.dh{padding:1rem 1rem .5rem;display:flex;gap:.5rem}
.dh input{flex:1;font:16px var(--ui);padding:.6rem .8rem;border-radius:13px;border:1px solid var(--line)}
.list{overflow:auto;max-height:62vh;padding:.3rem 1rem 1rem}
.law{background:#fff;border:1px solid var(--line);border-radius:16px;padding:.8rem .9rem;margin-bottom:.6rem}
.law b{display:block}.law pre{margin:.3rem 0;font:1.02rem/1.5 var(--math);color:#3730a3;white-space:pre-wrap}.law p{margin:0 0 .5rem;color:var(--mut);font-size:.9rem}
#msg{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1e2f86;color:#fff;padding:.5rem 1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
#msg.on{opacity:1}
#pr{display:none}
@media print{body{background:#fff;display:block}header,main{display:none}#pr{display:block;font:12pt/1.5 var(--math);white-space:pre-wrap}#pr table{margin:0}#pr td{padding:.3rem .8rem;text-align:center}}
</style>
</head>
<body>
<header>
 <svg viewBox="0 0 52 52" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86c8ff"/><stop offset="1" stop-color="#1b6bff"/></linearGradient></defs><rect x="2" y="2" width="48" height="48" rx="15" fill="url(#g)"/><rect x="5" y="4" width="42" height="20" rx="11" fill="#fff" opacity=".35"/><path d="M26 15 14 36h24z" fill="none" stroke="#ebf3ff" stroke-width="2.6" stroke-linejoin="round"/><circle cx="26" cy="15" r="5" fill="#fff"/><circle cx="14" cy="36" r="5" fill="#fff"/><circle cx="38" cy="36" r="5" fill="#67e8f9"/></svg>
 <b>LogicaDesk</b>
</header>
<main>
 <div class="glass">
  <div class="bar">
   <button class="btn on" id="tN">Appunti</button><button class="btn" id="tT">Tavola di verità</button><span class="sep"></span>
   <button class="btn" id="bOpen">Apri</button><button class="btn on" id="bSave">Salva</button>
   <button class="btn peri" id="bPdf">PDF</button><button class="btn lil" id="bDoc">Word</button><span class="sep"></span>
   <button class="btn" id="bLaw">Formulario</button><button class="btn lil" id="bGr">α Greche</button>
  </div>
  <div class="keys" id="keys"></div>
  <div class="keys" id="greek"></div>
 </div>
 <div class="glass doc">
  <textarea id="ed" placeholder="Scrivi qui i tuoi appunti di logica…" spellcheck="false" autocapitalize="off"></textarea>
  <div id="tv">
   <div class="ctl">
    <label>Righe <button class="btn" data-d="r-1">−</button><output id="oR"></output><button class="btn" data-d="r1">+</button></label>
    <label>Colonne <button class="btn" data-d="c-1">−</button><output id="oC"></output><button class="btn" data-d="c1">+</button></label>
    <button class="btn peri" id="bClr">Ripulisci tavola</button><button class="btn on" id="bIns">Inserisci negli appunti</button>
   </div>
   <div class="grid"><table id="tb"></table></div>
  </div>
 </div>
</main>
<dialog id="dlg"><div class="dh"><input id="q" type="search" placeholder="Cerca per nome o simbolo…"><button class="btn" id="xClose">Chiudi</button></div><div class="list" id="laws"></div></dialog>
<input type="file" id="file" accept=".txt,.md,.logic,.tsv" hidden>
<div id="pr"></div><div id="msg"></div>
<script>
const D={"sym": [["¬", "Negazione"], ["∧", "Congiunzione"], ["∨", "Disgiunzione"], ["→", "Implicazione"], ["⇒", "Implicazione logica (freccia doppia)"], ["↔", "Equivalenza"], ["⊕", "Disgiunzione esclusiva"], ["∀", "Per ogni"], ["∃", "Esiste"], ["∴", "Conclusione"], ["⊤", "Vero"], ["⊥", "Falso"], ["⊢", "Dimostra"], ["⊨", "Conseguenza semantica"], ["≡", "Equivalenza logica"], ["∈", "Appartiene"], ["∉", "Non appartiene"], ["∅", "Insieme vuoto"], ["ℕ", "Numeri naturali"], ["ℤ", "Numeri interi"]], "gr": [["α", "Alfa"], ["β", "Beta"], ["γ", "Gamma"], ["δ", "Delta"], ["ε", "Epsilon"], ["θ", "Theta"], ["λ", "Lambda"], ["μ", "Mu"], ["ν", "Nu"], ["ξ", "Xi"], ["π", "Pi"], ["ρ", "Rho"], ["σ", "Sigma"], ["τ", "Tau"], ["φ", "Phi"], ["χ", "Chi"], ["ψ", "Psi"], ["ω", "Omega"], ["Γ", "Gamma maiuscola"], ["Δ", "Delta maiuscola"], ["Θ", "Theta maiuscola"], ["Λ", "Lambda maiuscola"], ["Ξ", "Xi maiuscola"], ["Π", "Pi maiuscola"], ["Σ", "Sigma maiuscola"], ["Φ", "Phi maiuscola"], ["Ψ", "Psi maiuscola"], ["Ω", "Omega maiuscola"]], "laws": [["Identità", "p ∧ ⊤ ≡ p     ·     p ∨ ⊥ ≡ p", "Il vero non cambia una congiunzione; il falso non cambia una disgiunzione."], ["Dominazione", "p ∨ ⊤ ≡ ⊤     ·     p ∧ ⊥ ≡ ⊥", "Il vero domina la disgiunzione e il falso domina la congiunzione."], ["Idempotenza", "p ∧ p ≡ p     ·     p ∨ p ≡ p", "Ripetere la stessa proposizione non ne cambia il valore."], ["Doppia negazione", "¬¬p ≡ p", "Negare due volte una proposizione restituisce la proposizione iniziale."], ["Terzo escluso", "p ∨ ¬p ≡ ⊤", "Una proposizione o la sua negazione: una delle due è vera."], ["Non contraddizione", "p ∧ ¬p ≡ ⊥", "Una proposizione e la sua negazione non possono essere vere insieme."], ["Commutatività", "p ∧ q ≡ q ∧ p     ·     p ∨ q ≡ q ∨ p", "L'ordine degli argomenti non cambia congiunzione o disgiunzione."], ["Associatività", "(p ∧ q) ∧ r ≡ p ∧ (q ∧ r)     ·     (p ∨ q) ∨ r ≡ p ∨ (q ∨ r)", "Le parentesi si possono spostare quando si ripete lo stesso connettivo."], ["Distributività", "p ∧ (q ∨ r) ≡ (p ∧ q) ∨ (p ∧ r)\np ∨ (q ∧ r) ≡ (p ∨ q) ∧ (p ∨ r)", "La congiunzione e la disgiunzione si distribuiscono l'una sull'altra."], ["Leggi di De Morgan", "¬(p ∧ q) ≡ ¬p ∨ ¬q\n¬(p ∨ q) ≡ ¬p ∧ ¬q", "Negando una congiunzione o una disgiunzione, si scambia il connettivo."], ["Assorbimento", "p ∨ (p ∧ q) ≡ p     ·     p ∧ (p ∨ q) ≡ p", "Una formula assorbe la parte più complessa che la contiene."], ["Implicazione materiale", "p → q ≡ ¬p ∨ q", "L'implicazione è falsa solo quando p è vera e q è falsa."], ["Contrapposizione", "p → q ≡ ¬q → ¬p", "Un'implicazione è equivalente alla sua contrapposta."], ["Bicondizionale", "p ↔ q ≡ (p → q) ∧ (q → p)", "Il bicondizionale richiede che valgano entrambe le implicazioni."], ["Forma disgiuntiva del bicondizionale", "p ↔ q ≡ (p ∧ q) ∨ (¬p ∧ ¬q)", "Le due proposizioni hanno lo stesso valore di verità."], ["Esportazione", "(p ∧ q) → r ≡ p → (q → r)", "Una congiunzione nell'antecedente si può riscrivere come implicazioni successive."]]};
const $=s=>document.querySelector(s), ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const ed=$('#ed'), tb=$('#tb');
let mode='n', last=ed, T=JSON.parse(ls('ld_t')||'null')||{r:5,c:4,d:[]};
const msg=t=>{const m=$('#msg');m.textContent=t;m.classList.add('on');setTimeout(()=>m.classList.remove('on'),1800)};
const kind=(v)=>{v=v.trim().toLowerCase();return ['v','vero','t','true','1'].includes(v)?'v':['f','falso','false','0'].includes(v)?'f':''};
/* tasti */
const mk=(box,arr)=>arr.forEach(([s,n])=>{const b=document.createElement('button');b.className='key';b.textContent=s;b.title=n;b.setAttribute('aria-label',n);
 b.onpointerdown=e=>e.preventDefault();b.onclick=()=>ins(s);box.append(b)});
mk($('#keys'),D.sym);mk($('#greek'),D.gr);
function ins(t){const el=(last&&document.body.contains(last))?last:ed;el.focus();const a=el.selectionStart??el.value.length,b=el.selectionEnd??a;
 el.setRangeText(t,a,b,'end');el.dispatchEvent(new Event('input',{bubbles:true}))}
document.addEventListener('focusin',e=>{if(e.target===ed||e.target.closest('#tb'))last=e.target});
/* appunti */
ed.value=ls('ld_n')||'';ed.oninput=()=>ls('ld_n',ed.value);
/* tavola */
function cell(r,c){return (T.d[r]&&T.d[r][c])||''}
function build(){T.d=Array.from({length:T.r},(_,r)=>Array.from({length:T.c},(_,c)=>cell(r,c)));$('#oR').textContent=T.r;$('#oC').textContent=T.c;
 tb.innerHTML='';T.d.forEach((row,r)=>{const tr=tb.insertRow();row.forEach((v,c)=>{const i=document.createElement('input');i.value=v;i.dataset.r=r;i.dataset.c=c;
  i.setAttribute('enterkeyhint','next');i.autocapitalize='off';i.spellcheck=false;paint(i,r);tr.insertCell().append(i)})});fit();ls('ld_t',JSON.stringify(T))}
const cv=document.createElement('canvas').getContext('2d');
function fit(){cv.font='700 17px Cambria,"Cambria Math","Noto Serif",Georgia,serif';
 for(let c=0;c<T.c;c++){let w=0;T.d.forEach(r=>{w=Math.max(w,cv.measureText(r[c]||'').width)});
  const px=Math.max(83,Math.ceil(w)+30);tb.querySelectorAll(`input[data-c="${c}"]`).forEach(i=>i.style.width=px+'px')}}
function paint(i,r){i.className=r?kind(i.value):''}
tb.addEventListener('input',e=>{const i=e.target,r=+i.dataset.r,c=+i.dataset.c;T.d[r][c]=i.value;paint(i,r);fit();ls('ld_t',JSON.stringify(T))});
tb.addEventListener('keydown',e=>{const i=e.target,r=+i.dataset.r,c=+i.dataset.c;let dr=0,dc=0;
 if(e.key==='Enter'||e.key==='ArrowDown')dr=1;else if(e.key==='ArrowUp')dr=-1;
 else if(e.key==='ArrowLeft'&&i.selectionStart===0)dc=-1;else if(e.key==='ArrowRight'&&i.selectionStart===i.value.length)dc=1;else return;
 const n=tb.querySelector(`input[data-r="${r+dr}"][data-c="${c+dc}"]`);if(n){e.preventDefault();n.focus();n.select()}});
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const k=b.dataset.d[0],d=+b.dataset.d.slice(1);
 if(k==='r')T.r=Math.min(30,Math.max(1,T.r+d));else T.c=Math.min(16,Math.max(1,T.c+d));build()});
$('#bClr').onclick=()=>{T.d=[];build();msg('Tavola ripulita')};
function box(rows){const w=rows[0].map((_,c)=>Math.max(1,...rows.map(r=>[...r[c]].length)));
 const cen=(s,n)=>{const l=[...s].length,a=Math.floor((n-l)/2);return ' '.repeat(a)+s+' '.repeat(n-l-a)};
 const ln=(l,m,r,f)=>l+w.map(n=>f.repeat(n+2)).join(m)+r,o=[ln('┌','┬','┐','─')];
 rows.forEach((r,i)=>{o.push('│ '+r.map((v,c)=>cen(v,w[c])).join(' │ ')+' │');if(i===0&&rows.length>1)o.push(ln('╞','╪','╡','═'));else if(i<rows.length-1)o.push(ln('├','┼','┤','─'))});
 o.push(ln('└','┴','┘','─'));return o.join('\n')}
$('#bIns').onclick=()=>{const t='\n'+box(T.d)+'\n';setMode('n');ed.focus();const p=ed.selectionEnd??ed.value.length;ed.setRangeText(t,p,p,'end');ed.dispatchEvent(new Event('input'));msg('Tavola inserita negli appunti')};
/* modalità */
function setMode(m){mode=m;ed.style.display=m==='n'?'block':'none';$('#tv').style.display=m==='t'?'flex':'none';
 $('#tN').classList.toggle('on',m==='n');$('#tT').classList.toggle('on',m==='t');last=m==='n'?ed:last;if(m==='t'&&!tb.rows.length)build()}
$('#tN').onclick=()=>setMode('n');$('#tT').onclick=()=>setMode('t');
$('#bGr').onclick=()=>$('#greek').classList.toggle('open');
/* file */
const tsv=()=>T.d.map(r=>r.join('\t')).join('\n');
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
$('#bSave').onclick=()=>{mode==='n'?dl('appunti.txt',ed.value,'text/plain;charset=utf-8'):dl('tavola.tsv',tsv(),'text/tab-separated-values;charset=utf-8');msg('File salvato')};
$('#bOpen').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const t=await f.text();
 if(/\.tsv$/i.test(f.name)){T.d=t.replace(/\r/g,'').split('\n').filter((x,i,a)=>x||i<a.length-1).map(l=>l.split('\t'));T.r=Math.min(30,Math.max(1,T.d.length));T.c=Math.min(16,Math.max(1,Math.max(...T.d.map(r=>r.length))));build();setMode('t')}
 else{ed.value=t;ls('ld_n',t);setMode('n')}e.target.value='';msg('File aperto')};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function html(){return mode==='n'?`<pre style="font-family:Cambria,serif;font-size:12pt">${esc(ed.value)}</pre>`:
 `<table border="1" cellpadding="6" style="border-collapse:collapse;text-align:center;font-family:Cambria,serif">${T.d.map((r,i)=>'<tr>'+r.map(v=>`<${i?'td':'th'}>${esc(v)||'&nbsp;'}</${i?'td':'th'}>`).join('')+'</tr>').join('')}</table>`}
$('#bDoc').onclick=()=>{dl(mode==='n'?'appunti.doc':'tavola.doc','<html><head><meta charset="utf-8"></head><body>'+html()+'</body></html>','application/msword');msg('Word salvato')};
$('#bPdf').onclick=()=>{$('#pr').innerHTML=html();msg('Scegli «Salva come PDF»');setTimeout(()=>print(),400)};
/* formulario */
function laws(f=''){f=f.toLowerCase();const L=$('#laws');L.innerHTML='';D.laws.filter(x=>(x[0]+x[1]+x[2]).toLowerCase().includes(f)).forEach(([n,fm,d])=>{
 const e=document.createElement('div');e.className='law';e.innerHTML=`<b>${esc(n)}</b><pre>${esc(fm)}</pre><p>${esc(d)}</p>`;
 const b=document.createElement('button');b.className='btn';b.textContent='Inserisci';b.onclick=()=>{$('#dlg').close();ins(fm.replace(/\s{3,}·\s{3,}/g,'\n'))};e.append(b);L.append(e)})}
$('#bLaw').onclick=()=>{laws();$('#q').value='';$('#dlg').showModal()};$('#q').oninput=e=>laws(e.target.value);$('#xClose').onclick=()=>$('#dlg').close();
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();$('#bSave').click()}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
